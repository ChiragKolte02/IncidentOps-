spring.application.name=user-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/incidentops}
spring.datasource.username=incidentops
spring.datasource.password=incidentops

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app.jwt.expiration-ms=28800000

app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
app.auth-cookie.secure=${AUTH_COOKIE_SECURE:false}
logging.level.org.springframework.security=DEBUG
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}