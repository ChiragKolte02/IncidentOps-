spring.application.name=incident-service

server.port=8081

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=incident-service-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.incident_service.dto

spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.consumer.properties.spring.json.value.default.type=com.example.incident_service.dto.AlertEvent

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/incidentops?options=-c%20TimeZone=UTC}
spring.datasource.username=incidentops
spring.datasource.password=incidentops
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET:MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=}
app.user-service.base-url=${USER_SERVICE_URL:http://localhost:8083}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# FastAPI AI Agent integration
ai.agent.url=${AI_AGENT_URL:http://localhost:8000}
ai.agent.internal-api-key=${AI_AGENT_INTERNAL_API_KEY:}