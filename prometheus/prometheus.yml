global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  - job_name: "unix-server"
    static_configs:
      - targets: ["unix-server:9100"]

  - job_name: "db-server"
    static_configs:
      - targets: ["db-server:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]